services:
  app:
    build:
      context: .
      target: app
    env_file:
      - .env.docker
    restart: unless-stopped

  nginx:
    build:
      context: .
      target: nginx
    ports:
      - "8080:80"
    depends_on:
      - app
    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost/up"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s